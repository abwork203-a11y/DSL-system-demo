<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data:;
      connect-src 'self' https://www.googleapis.com https://accounts.google.com https://dsl-system-demo.onrender.com wss:https://dsl-system-demo.onrender.com;
      frame-src https://accounts.google.com;
      object-src 'none';
      base-uri 'self';
    ">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Applies any saved theme/font before first paint. Same-origin file
         (not an inline script) so it runs under the existing CSP's
         script-src 'self' without needing 'unsafe-inline'. -->
    <script src="/theme-init.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>LedgerOne — Distribution Sales &amp; Ledger Management</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
